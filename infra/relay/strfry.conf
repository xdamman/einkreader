# Minimal strfry config for relay.einkreader.app.
db = "/app/strfry-db"
relay {
    bind = "0.0.0.0"
    port = 7777
    info {
        name = "einkreader relay"
        description = "Carries einkreader users' profiles and shared highlights. Writes are limited to registered einkreader.app users; reads are open."
        contact = "xdamman@opencollective.com"
    }
    writePolicy {
        plugin = "/app/strfry-policy.py"
    }
}
